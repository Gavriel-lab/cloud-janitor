site_name: Cloud Janitor
site_description: Documentation for Cloud Janitor, a tool for automating cloud maintenance and cleanup tasks.
repo_url: https://github.com/CaravanaCloud/cloud-janitor
repo_name: CaravanaCloud/cloud-janitor

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Tasks: tasks.md
  - Architecture decisions:
      - ADRs: adr/index.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

